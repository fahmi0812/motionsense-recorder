plugins {
  alias(libs.plugins.android.application)
}

// Kredensial Supabase dibaca dari local.properties (TIDAK di-commit) atau -P gradle property / env.
def localProps = new Properties()
def lp = rootProject.file('local.properties')
if (lp.exists()) lp.withInputStream { localProps.load(it) }
def cfg = { String k -> (localProps.getProperty(k) ?: project.findProperty(k) ?: System.getenv(k) ?: '').toString() }

android {
  namespace 'id.ac.pcr.motionsense.recorder'
  compileSdk 34

  defaultConfig {
    applicationId "id.ac.pcr.motionsense.recorder"
    minSdk 26
    targetSdk 34
    versionCode 1
    versionName "0.1.0"
    buildConfigField "String", "SUPABASE_URL", "\"${cfg('SUPABASE_URL')}\""
    buildConfigField "String", "SUPABASE_ANON_KEY", "\"${cfg('SUPABASE_ANON_KEY')}\""
  }
  buildFeatures { buildConfig true }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

dependencies {
  implementation libs.appcompat
  implementation libs.material
  implementation libs.activity
  implementation libs.constraintlayout
}
